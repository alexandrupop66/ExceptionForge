[project]
name = "exceptionforge"
version = "0.1.0"
description = "Evidence-led procurement exception investigation with sandboxed agent-generated code"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.9", "openai>=1.50,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
